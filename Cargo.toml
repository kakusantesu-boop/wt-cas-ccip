[package]
name = "wt-cas-ccip"
version = "0.2.0"
edition = "2024"
description = "War Thunder non-intrusive third-person CAS bomb & rocket CCIP prototype"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
